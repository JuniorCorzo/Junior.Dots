[colors.cursor]
text = "#{{colors.surface.default.hex_stripped}}"
cursor = "#{{colors.primary.default.hex_stripped}}"

[colors.normal]
black   = "#{{colors.surface_container_highest.default.hex_stripped}}"
red     = "#{{colors.error.default.hex_stripped}}"
green   = "#{{colors.primary.default.hex_stripped}}"
yellow  = "#{{colors.secondary.default.hex_stripped}}"
blue    = "#{{colors.tertiary.default.hex_stripped}}"
magenta = "#{{colors.primary_container.default.hex_stripped}}"
cyan    = "#{{colors.secondary_container.default.hex_stripped}}"
white   = "#{{colors.on_surface.default.hex_stripped}}"

[colors.bright]
black   = "#{{colors.outline.default.hex_stripped}}"
red     = "#{{colors.error.default.hex_stripped}}"
green   = "#{{colors.primary.default.hex_stripped}}"
yellow  = "#{{colors.secondary.default.hex_stripped}}"
blue    = "#{{colors.tertiary.default.hex_stripped}}"
magenta = "#{{colors.primary_container.default.hex_stripped}}"
